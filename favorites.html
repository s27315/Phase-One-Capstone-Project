<!doctype html>
<!-- Favorites page: show and remove saved books. -->
<html lang="en">
  <head>
    <!-- Head setup: title, responsive meta, and styles. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book Explorer | Favorites</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="min-h-screen text-slate-900">
    <!-- Top navigation across all pages. -->
    <header class="border-b border-slate-200 bg-white/90 backdrop-blur sticky top-0 z-20">
      <nav class="mx-auto flex w-full max-w-6xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
        <a href="index.html" class="text-xl font-extrabold tracking-tight text-indigo-700">Book Explorer</a>
        <ul class="flex items-center gap-2 sm:gap-4">
          <li>
            <a
              href="index.html"
              class="nav-link rounded-md px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100"
              >Home</a
            >
          </li>
          <li>
            <a
              href="favorites.html"
              class="nav-link rounded-md bg-indigo-700 px-3 py-2 text-sm font-semibold text-white"
              aria-current="page"
              >Favorites</a
            >
          </li>
          <li>
            <a
              href="about.html"
              class="nav-link rounded-md px-3 py-2 text-sm font-semibold text-slate-700 hover:bg-slate-100"
              >About</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <!-- Favorites content area. -->
    <main class="mx-auto w-full max-w-6xl px-4 py-10 sm:px-6 lg:px-8">
      <section>
        <h1 class="text-3xl font-black tracking-tight">Your Favorites</h1>
        <p class="mt-2 text-slate-600">Books you save on Home appear here.</p>
      </section>

      <section class="mt-8">
        <div id="statusMessage" class="mb-6 hidden rounded-lg border px-4 py-3 text-sm"></div>
        <div id="favoritesGrid" class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3"></div>
      </section>
    </main>

    <!-- Shared footer with links and favorites count. -->
    <footer class="site-footer mt-12">
      <div class="mx-auto grid w-full max-w-6xl gap-8 px-4 py-10 sm:px-6 lg:grid-cols-3 lg:px-8">
        <section>
          <h2 class="text-lg font-extrabold text-white">Book Explorer</h2>
          <p class="mt-2 text-sm text-sky-100">
            Find books, save favorites, and discover new reads.
          </p>
          <p id="favoritesCount" aria-live="polite" class="footer-badge mt-4">Favorites: 0</p>
        </section>

        <section>
          <h3 class="text-sm font-bold uppercase tracking-wide text-white">Explore</h3>
          <div class="mt-3 flex flex-wrap gap-2">
            <a href="index.html" class="footer-link">Home</a>
            <a href="favorites.html" class="footer-link">Favorites</a>
            <a href="about.html" class="footer-link">About</a>
            <a href="https://bookexplorer.example.com" target="_blank" rel="noopener noreferrer" class="footer-link"
              >Official Website</a
            >
          </div>
        </section>

        <section>
          <h3 class="text-sm font-bold uppercase tracking-wide text-white">Social</h3>
          <div class="mt-3 flex flex-wrap gap-2">
            <a href="https://instagram.com/bookexplorer" target="_blank" rel="noopener noreferrer" class="footer-social"
              >Instagram</a
            >
            <a href="https://x.com/bookexplorer" target="_blank" rel="noopener noreferrer" class="footer-social">X</a>
            <a href="https://www.goodreads.com/" target="_blank" rel="noopener noreferrer" class="footer-social"
              >Goodreads</a
            >
            <a href="https://www.youtube.com/" target="_blank" rel="noopener noreferrer" class="footer-social"
              >YouTube</a
            >
          </div>
        </section>
      </div>
    </footer>

    <script type="module" src="js/favoritesPage.js"></script>
  </body>
</html>
